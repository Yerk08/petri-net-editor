<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./client/manifest.json">
    <title>Редактор Сетей Петри</title>
    <link rel="stylesheet" href="./client/styles.css">
    <link rel="icon" href="./client/icon.png">
</head>

<body>

    <!-- СЛЕВА: Меню управления -->
    <div id="left-menu">
        <h3>Инструменты</h3>
        <button id="btn-select" class="active" onclick="setMode('select')">🖐️ Выделение / Движение</button>

        <button id="btn-simulation" onclick="setMode('simulation')">▶️ Режим Симуляции</button>
        <button id="btn-reset-sim" onclick="resetSimulation()"
            style="display:none; background: #f8d7da; color: #721c24;">🔄 Сбросить к начальной</button>
        <button id="btn-apply-sim" onclick="applySimulationState()"
            style="display:none; background: #d4edda; color: #155724;">✅ Утвердить текущую разметку</button>

        <div id="btn-undo-redo-sim" style="display:none; gap: 8px; width: 100%;">
            <button id="btn-undo-sim" onclick="undoTransition()"
                style="flex: 1; background: #fff3cd; color: #856404;">↩️ Назад</button>
            <button id="btn-redo-sim" onclick="redoTransition()"
                style="flex: 1; background: #e7eeff; color: #383d41;">↪️ Вперед</button>
        </div>

        <button id="btn-place" onclick="setMode('place')">⚪ Позиция (P)</button>
        <button id="btn-transition" onclick="setMode('transition')">⬛ Переход (T)</button>
        <button id="btn-arc" onclick="setMode('arc')">➡️ Дуга (→)</button>
        <button id="btn-token" onclick="setMode('token')">⚫ Фишка (+1)</button>
        <button id="btn-comment" onclick="setMode('comment')">📝 Комментарий (Текст)</button>

        <div class="section-title">Фильтр цветов</div>
        <div class="color-filter-box">
            <label><input type="checkbox" id="chk-filter-black" checked onchange="toggleFilterColor('black')">⚫</label>
            <label><input type="checkbox" id="chk-filter-red" checked onchange="toggleFilterColor('red')">🔴</label>
            <label><input type="checkbox" id="chk-filter-blue" checked onchange="toggleFilterColor('blue')">🔵</label>
            <label><input type="checkbox" id="chk-filter-green" checked onchange="toggleFilterColor('green')">🟢</label>
        </div>

        <div class="section-title">Управление холстом</div>
        <button onclick="clearPetriNet()" class="btn-danger"
            style="background: #fff0f0; color: #d93838; border-color: #f5c2c2;">🧹 Очистить всё</button>
        <div style="display: flex; gap: 8px; width: 100%;">
            <button onclick="exportToSVG()" style="flex: 1; background: #fffbe6; border-color: #ffe58f;">🎨 SVG</button>
            <button onclick="exportToPDF()" style="flex: 1; background: #fffbe6; border-color: #ffe58f;">📄 Печать</button>
        </div>
        <button onclick="toggleTheme()" id="theme-btn"
            style="background: #f5f5f5; color: #262626; border-color: #d9d9d9;">🌓 Сменить тему</button>

        <div class="section-title">Файлы</div>
        <button onclick="exportToFile()" style="background: #eef7ff; border-color: #bce0ff;">💾 Экспорт в JSON</button>
        <button onclick="document.getElementById('import-file-input').click()"
            style="background: #f6fff5; border-color: #cfffcc;">📂 Импорт из JSON</button>
        <input type="file" id="import-file-input" accept=".json" onchange="importFromFile(event)"
            style="display: none;">

    </div>

    <!-- ПОЦЕНТРУ: Графический холст -->
    <div id="canvas-container">
        <svg id="petri-svg" onpointerdown="onCanvasMouseDown(event)">
            <g id="viewport">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6"
                        orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#555" />
                    </marker>
                </defs>
                <g id="arcs-group"></g>
                <g id="nodes-group"></g>
            </g>
        </svg>
    </div>

    <!-- СПРАВА: Свойства выбранного объекта -->
    <div id="right-menu">
        <h3>Свойства</h3>
        <div id="properties-panel">
            <p style="color:#888;">Выберите объект для редактирования</p>
        </div>
    </div>

    <script type="module" src="./client/editor.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker успешно зарегистрирован!', reg.scope))
                    .catch(err => console.log('Ошибка регистрации Service Worker:', err));
            });
        }
    </script>
</body>

</html>
