services:
  master:
    build: ./master
    ports:
      - "5000:5000"
    volumes:
      - ./algorithms:/app/algorithms
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      - MASTER_URL=http://master:5000
      - MAX_CORES=8
    depends_on:
      - master
    deploy:
      replicas: 1
    restart: unless-stopped

  web-worker:
    build:
      dockerfile: Dockerfile.wasm
    ports:
      - "5001:5001"
    restart: unless-stopped

